server.port=8080
spring.datasource.url=${ORDER_DATABASE_URL:jdbc:postgresql://localhost:5432/orders}
spring.datasource.username=${ORDER_DATABASE_USER:commerce}
spring.datasource.password=${ORDER_DATABASE_PASSWORD:commerce-local-only}
spring.sql.init.mode=always
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:commerce}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:commerce-local-only}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3000
inventory.url=${INVENTORY_URL:http://localhost:8081}
payment.url=${PAYMENT_URL:http://localhost:8082}
shipping.url=${SHIPPING_URL:http://localhost:8083}
server.error.include-message=always
