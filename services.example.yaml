application:
  id: commercelens
  name: CommerceLens
  repository: https://github.com/nagv/CommerceLens.git
  repository_ref: codex/commercelens-monorepo
services:
- id: customer-portal
  repository: https://github.com/nagv/CommerceLens.git
  path: services/customer-portal
  aliases:
  - web-portal
  catalog_pages:
  - openwiki/service-context.md
  repository_ref: codex/commercelens-monorepo
  repository_path: services/customer-portal
- id: order-service
  repository: https://github.com/nagv/CommerceLens.git
  path: services/order-service
  aliases:
  - orders-api
  - orders.internal
  catalog_pages:
  - openwiki/service-context.md
  - openwiki/workflows/failure-handling.md
  repository_ref: codex/commercelens-monorepo
  repository_path: services/order-service
- id: inventory-service
  repository: https://github.com/nagv/CommerceLens.git
  path: services/inventory-service
  aliases:
  - inventory-api
  - inventory.internal
  catalog_pages:
  - openwiki/service/overview.md
  - openwiki/service/dependencies.md
  - openwiki/service/api.md
  repository_ref: codex/commercelens-monorepo
  repository_path: services/inventory-service
- id: payment-service
  repository: https://github.com/nagv/CommerceLens.git
  path: services/payment-service
  aliases:
  - payments-api
  - payments.internal
  catalog_pages:
  - openwiki/service-context.md
  repository_ref: codex/commercelens-monorepo
  repository_path: services/payment-service
- id: shipping-service
  repository: https://github.com/nagv/CommerceLens.git
  path: services/shipping-service
  aliases:
  - shipping-api
  - shipping.internal
  catalog_pages:
  - openwiki/service/overview.md
  - openwiki/integrations/provider.md
  repository_ref: codex/commercelens-monorepo
  repository_path: services/shipping-service
- id: notification-worker
  repository: https://github.com/nagv/CommerceLens.git
  path: services/notification-worker
  aliases:
  - notifications
  catalog_pages:
  - openwiki/service-context.md
  repository_ref: codex/commercelens-monorepo
  repository_path: services/notification-worker
pipeline:
  per_repository_order:
  - graphify
  - openwiki
  - normalize
  graphify_command:
  - graphify
  - extract
  - .
  - --code-only
  - --force
  openwiki_command:
  - openwiki
  - --update
  - --print
